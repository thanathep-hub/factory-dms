<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory DMS — ค้นหาเอกสาร</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="session.js"></script>
<script src="sidebar.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
.emp-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(22,163,74,.1);color:var(--green);border:1px solid rgba(22,163,74,.2)}
.doc-row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
.doc-row:hover{background:var(--bg3)}
.doc-row:last-child{border-bottom:none}
.big-search{display:flex;align-items:center;gap:12px;background:var(--bg2);border:2px solid var(--accent-border);border-radius:var(--radius-lg);padding:12px 18px;box-shadow:var(--shadow-md);transition:border-color .15s}
.big-search:focus-within{border-color:var(--accent)}
.big-search input{flex:1;border:none;outline:none;font-family:var(--font);font-size:16px;color:var(--text);background:transparent}
.big-search input::placeholder{color:var(--text3)}
.highlight{background:rgba(37,99,235,.12);color:var(--accent);border-radius:2px;padding:0 1px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <button class="btn btn-ghost btn-sm" onclick="toggleSidebar()" style="padding:5px 8px"><i data-lucide="menu"></i></button>
      <span id="topbar-role" style="font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;margin-right:4px"></span><div class="page-title">ค้นหาเอกสาร <span class="page-sub">Browse Documents</span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-ghost btn-sm" onclick="location.href='emp-04-notification.html'" style="position:relative">
          <i data-lucide="bell"></i>
          <span style="position:absolute;top:4px;right:4px;width:6px;height:6px;background:var(--red);border-radius:50%"></span>
        </button>
        <div class="avatar" style="cursor:pointer" onclick="location.href='00-login.html'">AT</div>
      </div>
    </div>

    <div class="content">
      <!-- Big search -->
      <div class="big-search" style="margin-bottom:16px">
        <i data-lucide="search" style="width:22px;height:22px;color:var(--text3);flex-shrink:0"></i>
        <input type="text" id="search-input" placeholder="ค้นหา รหัสเอกสาร / ชื่อ / เนื้อหา..." oninput="doSearch(this.value)" autofocus>
        <kbd style="font-size:10px;background:var(--bg4);border:1px solid var(--border2);border-radius:4px;padding:2px 6px;color:var(--text3);font-family:var(--mono)">Enter</kbd>
      </div>

      <!-- Filters -->
      <div class="filter-bar" style="margin-bottom:12px">
        <select class="filter-select" id="f-cat" onchange="doSearch(document.getElementById('search-input').value)">
          <option value="">ทุกหมวด</option><option>SOP</option><option>WI</option><option>FM</option>
        </select>
        <select class="filter-select" id="f-dept" onchange="doSearch(document.getElementById('search-input').value)">
          <option value="">ทุกแผนก</option>
          <option value="Engineering">Engineering</option>
          <option value="Production">Production</option>
          <option value="QA">QA / QC</option>
          <option value="Warehouse">Warehouse</option>
        </select>
        <div style="display:flex;gap:6px;margin-left:auto">
          <button class="btn btn-ghost btn-sm" onclick="setView('list')" id="btn-list" style="background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border)"><i data-lucide="list"></i></button>
          <button class="btn btn-ghost btn-sm" onclick="setView('grid')" id="btn-grid"><i data-lucide="layout-grid"></i></button>
        </div>
      </div>

      <!-- Recent / results -->
      <div id="search-hint" style="margin-bottom:14px">
        <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">ค้นหาล่าสุด</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${['SOP-ENG-022','WI-PRD-042','SOP-PRD-001','FM-QA-021'].map(t=>`<button class="chip" onclick="quickSearch('${t}')">${t}</button>`).join('')}
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
          <i data-lucide="files" style="width:14px;height:14px;color:var(--accent)"></i>
          <span style="font-size:13px;font-weight:700" id="result-label">เอกสาร Active ทั้งหมด</span>
          <span style="font-size:11px;color:var(--text3)" id="result-count">— รายการ</span>
        </div>
        <div id="doc-results"></div>
      </div>
    </div>
  </main>
</div>

<!-- DOC DETAIL MODAL -->
<div class="modal-overlay" id="modal-doc">
  <div class="modal" style="max-width:540px">
    <div class="modal-header">
      <div class="modal-title" id="doc-modal-title">—</div>
      <button class="modal-close" onclick="closeModal('modal-doc')"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body" id="doc-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-doc')">ปิด</button>
      <button class="btn btn-ghost" onclick="showToast('ดาวน์โหลดเอกสาร','info')"><i data-lucide="download"></i> ดาวน์โหลด</button>
      <button class="btn btn-primary" onclick="closeModal('modal-doc');location.href='emp-01-my-documents.html'"><i data-lucide="git-branch"></i> สร้าง Revision</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
const allDocs=[
  {code:'SOP-PRD-001',name:'ขั้นตอนการผลิตเม็ดยา Paracetamol 500mg',cat:'SOP',dept:'Production',rev:'Rev 5',status:'Active',date:'28 พ.ค. 68',by:'สมชาย K.',desc:'ขั้นตอนครบถ้วนตั้งแต่ชั่งวัตถุดิบจนถึงบรรจุภัณฑ์'},
  {code:'WI-QC-015',name:'การตรวจสอบคุณภาพ In-process ไลน์ A',cat:'WI',dept:'QA',rev:'Rev 2',status:'Pending',date:'27 พ.ค. 68',by:'นภา P.',desc:'ขั้นตอน IPC ทุก 30 นาทีสำหรับไลน์ A'},
  {code:'FM-QA-021',name:'Batch Record Template — Liquid Oral',cat:'FM',dept:'QA',rev:'Rev 8',status:'Active',date:'26 พ.ค. 68',by:'วิภา S.',desc:'Template สำหรับบันทึก Batch ผลิตภัณฑ์ Liquid'},
  {code:'SOP-ENG-007B',name:'Preventive Maintenance Compactor M-02',cat:'SOP',dept:'Engineering',rev:'Rev 1',status:'Active',date:'05 พ.ค. 68',by:'อนุชา T.',desc:'ขั้นตอน PM รายไตรมาสสำหรับเครื่อง Compactor'},
  {code:'WI-PRD-042',name:'การตั้งค่าเครื่อง Tablet Press Fette 2090',cat:'WI',dept:'Production',rev:'Rev 3',status:'Active',date:'28 พ.ค. 68',by:'สมชาย K.',desc:'Setup guide และ troubleshooting'},
  {code:'FM-WH-003',name:'Receiving Checklist — Raw Material',cat:'FM',dept:'Warehouse',rev:'Rev 4',status:'Active',date:'22 พ.ค. 68',by:'พิมพ์ W.',desc:'Checklist รับวัตถุดิบพร้อม COA column'},
  {code:'WI-PRD-031',name:'การ Setup เครื่อง Coating Driacoater',cat:'WI',dept:'Production',rev:'Rev 6',status:'Active',date:'18 พ.ค. 68',by:'สมชาย K.',desc:'ขั้นตอน setup และ inlet temperature spec'},
  {code:'SOP-PRD-012',name:'การ Cleaning เครื่อง Granulator รุ่น PMA',cat:'SOP',dept:'Production',rev:'Rev 3',status:'Active',date:'15 พ.ค. 68',by:'สมชาย K.',desc:'Cleaning procedure ตาม validated method'},
  {code:'WI-ENG-008',name:'การตรวจสอบ Pressure Gauge ประจำสัปดาห์',cat:'WI',dept:'Engineering',rev:'Rev 4',status:'Active',date:'10 พ.ค. 68',by:'อนุชา T.',desc:'Weekly calibration check ทุก pressure gauge'},
  {code:'SOP-ENG-019',name:'PM รายไตรมาส — เครื่อง Granulator',cat:'SOP',dept:'Engineering',rev:'Rev 3',status:'Active',date:'18 พ.ค. 68',by:'อนุชา T.',desc:'PM checklist และ replacement parts'},
];

let viewMode='list';
let currentQ='';

function setView(v){
  viewMode=v;
  document.getElementById('btn-list').style.cssText=v==='list'?'background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border)':'';
  document.getElementById('btn-grid').style.cssText=v==='grid'?'background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border)':'';
  renderResults(getFiltered(currentQ),currentQ);
}

function getFiltered(q){
  const cat=document.getElementById('f-cat').value;
  const dept=document.getElementById('f-dept').value;
  return allDocs.filter(d=>{
    const mq=!q||d.code.toLowerCase().includes(q.toLowerCase())||d.name.toLowerCase().includes(q.toLowerCase())||d.desc.toLowerCase().includes(q.toLowerCase());
    const mc=!cat||d.cat===cat;
    const md=!dept||d.dept.includes(dept);
    return mq&&mc&&md&&d.status==='Active';
  });
}

function highlight(text,q){
  if(!q)return text;
  return text.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<span class="highlight">$1</span>');
}

function doSearch(q){
  currentQ=q;
  const data=getFiltered(q);
  document.getElementById('search-hint').style.display=q?'none':'block';
  document.getElementById('result-label').textContent=q?`ผลการค้นหา "${q}"`:'เอกสาร Active ทั้งหมด';
  renderResults(data,q);
}

function quickSearch(q){
  document.getElementById('search-input').value=q;
  doSearch(q);
}

function renderResults(data,q){
  const el=document.getElementById('doc-results');
  document.getElementById('result-count').textContent=data.length+' รายการ';
  if(!data.length){
    el.innerHTML=`<div style="text-align:center;padding:40px;color:var(--text3)"><i data-lucide="file-x" style="width:32px;height:32px;display:block;margin:0 auto 10px"></i>ไม่พบเอกสารที่ตรงกับ "${q}"</div>`;
    lucide.createIcons();return;
  }
  const sb={Active:'badge-green',Pending:'badge-amber'};
  if(viewMode==='list'){
    el.innerHTML=data.map(d=>`
      <div class="doc-row" onclick="openDocDetail('${d.code}')">
        <div style="width:34px;height:34px;border-radius:8px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0"><i data-lucide="file-text"></i></div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            <span style="font-family:var(--mono);font-size:11px;font-weight:700">${highlight(d.code,q)}</span>
            <span class="badge badge-gray" style="font-size:9px">${d.cat}</span>
            <span class="badge badge-gray" style="font-size:9px">${d.rev}</span>
            <span class="badge ${sb[d.status]||'badge-gray'}" style="font-size:9px">${d.status}</span>
          </div>
          <div style="font-size:12px;color:var(--text);margin-top:2px">${highlight(d.name,q)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:1px">${d.dept} · ${d.date} · ${d.by}</div>
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0" onclick="event.stopPropagation()">
          <button class="btn btn-ghost btn-xs" onclick="showToast('ดาวน์โหลด ${d.code}','info')"><i data-lucide="download" style="width:12px;height:12px"></i></button>
          <button class="btn btn-ghost btn-xs" onclick="openDocDetail('${d.code}')"><i data-lucide="eye" style="width:12px;height:12px"></i></button>
        </div>
      </div>`).join('');
  } else {
    el.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:12px">`+
      data.map(d=>`
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;cursor:pointer;transition:all .15s" onclick="openDocDetail('${d.code}')" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
          <div style="width:32px;height:32px;border-radius:7px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:8px"><i data-lucide="file-text"></i></div>
          <div style="font-family:var(--mono);font-size:11px;font-weight:700;margin-bottom:3px">${d.code}</div>
          <div style="font-size:11px;color:var(--text2);line-height:1.4;margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${d.name}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">
            <span class="badge badge-gray" style="font-size:9px">${d.rev}</span>
            <span class="badge ${sb[d.status]||'badge-gray'}" style="font-size:9px">${d.status}</span>
          </div>
        </div>`).join('')+'</div>';
  }
  lucide.createIcons();
}

function openDocDetail(code){
  const d=allDocs.find(x=>x.code===code);if(!d)return;
  document.getElementById('doc-modal-title').innerHTML=`<i data-lucide="file-text" style="color:var(--accent)"></i> ${d.code}`;
  document.getElementById('doc-modal-body').innerHTML=`
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <span class="badge badge-green">${d.status}</span>
      <span class="badge badge-blue">${d.rev}</span>
      <span class="badge badge-gray">${d.cat}</span>
      <span class="badge badge-gray">${d.dept}</span>
    </div>
    <div class="meta-grid" style="margin-bottom:12px">
      <div class="meta-item"><div class="meta-key">ชื่อเอกสาร</div><div class="meta-val" style="font-size:12px">${d.name}</div></div>
      <div class="meta-item"><div class="meta-key">แก้ไขล่าสุด</div><div class="meta-val" style="font-size:12px">${d.date} · ${d.by}</div></div>
    </div>
    <div style="background:var(--bg3);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--text2);border:1px solid var(--border);line-height:1.6">${d.desc}</div>`;
  openModal('modal-doc');
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed');}
function openModal(id){document.getElementById(id).classList.add('open');lucide.createIcons();}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');}));
function showToast(msg,type='info'){
  const wrap=document.getElementById('toast-wrap'),t=document.createElement('div');t.className='toast '+type;
  const ic={success:'circle-check',error:'alert-circle',info:'info'};
  const co={success:'var(--green)',error:'var(--red)',info:'var(--accent)'};
  t.innerHTML=`<i data-lucide="${ic[type]}" style="width:16px;height:16px;color:${co[type]};flex-shrink:0"></i><span>${msg}</span>`;
  wrap.appendChild(t);lucide.createIcons();
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';t.style.transition='.2s';setTimeout(()=>t.remove(),200);},3500);
}
document.addEventListener('DOMContentLoaded',()=>{doSearch('');lucide.createIcons();});

// ── Role-aware init ──
document.addEventListener('DOMContentLoaded', () => {
  buildSidebar('emp-02-browse');
  DMS_applyRoleUI();
  if (typeof lucide !== 'undefined') lucide.createIcons();
});
</script>
</body>
</html>
